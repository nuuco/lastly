<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0EA47F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LASTLY</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // file:// 로 열면 Vite 모듈이 안 떠서 빈 화면이 된다. http 서버일 때는 React가 바로 채운다.
      if (location.protocol === "file:") {
        document.getElementById("root").innerHTML =
          '<div style="max-width:420px;margin:48px auto;padding:0 20px;font-family:system-ui,sans-serif;color:#18241E">' +
          '<p style="color:#0EA47F;font-size:14px">LASTLY</p>' +
          '<h1 style="margin:8px 0 16px;font-size:24px">말만 하면 챙겨드릴게요</h1>' +
          '<p style="line-height:1.6;color:#63736A">이 파일을 직접 열면 앱이 뜨지 않습니다. 터미널에서 <code>npm run dev</code> 를 실행한 뒤 <a href="http://localhost:5173">http://localhost:5173</a> 을 열어 주세요.</p>' +
          "</div>";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
